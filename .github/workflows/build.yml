name: Build und Tests

on:
  # Branches nur über den Pull Request testen – sonst läuft jeder PR-Commit doppelt (push + pull_request).
  # Branch ohne PR: Workflow von Hand starten (workflow_dispatch).
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

# Neuer Commit im PR bricht den veralteten Lauf ab; main und Tags laufen immer zu Ende.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  WACHTL_VERSION: "1.0.2"

jobs:
  server:
    name: Server-Tests (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
        with:
          # releases/ (über 1 GB fertige Setups) braucht kein Job: spart 1,5–3,5 min Checkout je Job
          sparse-checkout: |
            /*
            !/releases/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q -n auto   # pytest-xdist: alle Kerne des Runners

  ui-quality:
    # Barrierefreiheit, Tastatur, Reflow und Performance-Budgets des Web-UI (docs/quality-guardrails.md).
    # Blockierend: Playwright/axe und Lighthouse-Assertions mit Stufe "error". Nur Hinweis: Lesbarkeit.
    # Playwright und Lighthouse laufen parallel auf je eigenem Runner mit eigenem Server (halbiert die Dauer).
    name: UI-Qualität (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite: [playwright, lighthouse]
    defaults:
      run:
        working-directory: server
    env:
      WACHTL_BASE_URL: http://127.0.0.1:5000
      WACHTL_E2E_PASSWORD: e2e-admin-passwort
    steps:
      - uses: actions/checkout@v4
        with:
          # releases/ (über 1 GB fertige Setups) braucht kein Job: spart 1,5–3,5 min Checkout je Job
          sparse-checkout: |
            /*
            !/releases/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: server/e2e/package-lock.json
      - run: pip install -r requirements-dev.txt
      - run: npm ci
        working-directory: server/e2e
      - run: npx playwright install --with-deps chromium
        if: matrix.suite == 'playwright'   # Lighthouse nutzt das Chrome des Runners
        timeout-minutes: 5   # dauert ~20 s; ein hängender Paket-Download soll nicht den ganzen Lauf blockieren
        working-directory: server/e2e
      - name: Wachtl mit Demodaten starten
        run: WACHTL_E2E_DIR=$RUNNER_TEMP/wachtl e2e/start-server.sh
      - name: Barrierefreiheit, Tastatur, Reflow (Playwright + axe-core)
        if: matrix.suite == 'playwright'
        run: npx playwright test
        working-directory: server/e2e
      - name: Lighthouse CI (3 Läufe je Seite, Median gegen Budgets)
        if: matrix.suite == 'lighthouse'
        working-directory: server/e2e
        run: |
          export WACHTL_COOKIE=$(node login-cookie.js)
          npx lhci autorun --config=lighthouserc.cjs
      - name: Lesbarkeit deutscher UI-Texte (nur Hinweis)
        if: matrix.suite == 'lighthouse'
        continue-on-error: true
        run: |
          export WACHTL_COOKIE=$(node e2e/login-cookie.js)
          python devtools/readability.py --warn $(node -e 'const {BASE,PAGES}=require("./e2e/pages");console.log(PAGES.map(p=>BASE+p[1]).join(" "))')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-quality-reports-${{ matrix.suite }}
          path: |
            server/e2e/playwright-report/
            server/e2e/test-results/
            server/e2e/.lighthouseci/
            ${{ runner.temp }}/wachtl/*.log

  probe:
    name: Windows-Probe bauen (C#)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # releases/ (über 1 GB fertige Setups) braucht kein Job: spart 1,5–3,5 min Checkout je Job
          sparse-checkout: |
            /*
            !/releases/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Testen und veröffentlichen
        shell: pwsh
        run: ./.github/scripts/run-logged.ps1 -Title "Probe-Build" -Command "./probe/build.ps1 -Version $env:WACHTL_VERSION -Output '${{ github.workspace }}/dist/probe'"
      - uses: actions/upload-artifact@v4
        with:
          name: wachtl-probe-win-x64
          path: dist/probe/

  windows-server:
    name: Windows-Server-Setup bauen und testen
    runs-on: windows-latest
    env:
      # Veröffentlichte Setups (main, Tags) mit höchster Kompression; PR-Läufe schnell (spart ~1 min)
      SETUP_COMPRESSION: ${{ (github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/')) && 'lzma2/fast' || '' }}
    # wartet nur auf die Probe, nicht auf die Python-Tests: die laufen parallel, und
    # Setups wandern erst ins Repository/Release, wenn auch die Server-Tests grün sind
    needs: [probe]
    steps:
      - uses: actions/checkout@v4
        with:
          # releases/ (über 1 GB fertige Setups) braucht kein Job: spart 1,5–3,5 min Checkout je Job
          sparse-checkout: |
            /*
            !/releases/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: wachtl-probe-win-x64
          path: dist/probe
      - name: Setup-Assistent bauen
        shell: pwsh
        run: ./.github/scripts/run-logged.ps1 -Title "Server-Setup-Build" -Command "./windows/build-server.ps1 -Version $env:WACHTL_VERSION -ProbeDir dist/probe -Output dist -Compression '${{ env.SETUP_COMPRESSION }}'"

      - name: Unbeaufsichtigt installieren
        shell: pwsh
        run: |
          $setup = "dist/WachtlSetup-$env:WACHTL_VERSION.exe"
          $p = Start-Process $setup -Wait -PassThru -ArgumentList @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/LOG=dist\setup-install.log', '/Role=Server',
            '/Hostnames=localhost,127.0.0.1', '/HttpsPort=8443', '/HttpPort=8080',
            '/AdminPassword=ci-test-passwort-123', '/DataDir=C:\WachtlData')
          Write-Host "Setup beendet mit $($p.ExitCode)"
          Get-Content C:\WachtlData\logs\setup.log -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { throw 'Setup fehlgeschlagen' }

      - name: Server prüfen
        shell: pwsh
        run: ./.github/scripts/run-logged.ps1 -Title "Server-Prüfung" -Command "./.github/scripts/test-server.ps1"

      - name: "Nur CI: Heartbeat der Probes 10 s statt 30 s (E2E-Tests warten oft auf den Heartbeat)"
        shell: pwsh
        run: ./.github/scripts/run-logged.ps1 -Title "CI-Heartbeat" -Command "./.github/scripts/ci-heartbeat.ps1"

      - name: Vorbelegtes Setup aus dem Web-UI unbeaufsichtigt installieren (Probe)
        shell: pwsh
        run: ./.github/scripts/run-logged.ps1 -Title "Probe-Prüfung" -Command "./.github/scripts/test-probe.ps1"

      - name: Pfad, Hop-Pings und iperf3 Ende-zu-Ende prüfen
        shell: pwsh
        run: ./.github/scripts/run-logged.ps1 -Title "E2E 0.3" -Command "./.github/scripts/test-v03.ps1"

      - name: Server-Probe, Standardpaket und Check-Status Ende-zu-Ende prüfen
        shell: pwsh
        run: ./.github/scripts/run-logged.ps1 -Title "E2E 0.4" -Command "./.github/scripts/test-v04.ps1"

      - name: Tray-Symbol und Störungsmeldungen Ende-zu-Ende prüfen
        shell: pwsh
        run: ./.github/scripts/run-logged.ps1 -Title "E2E 0.5" -Command "./.github/scripts/test-v05.ps1"

      - name: Sprachtest (RTP) Ende-zu-Ende prüfen
        shell: pwsh
        run: ./.github/scripts/run-logged.ps1 -Title "E2E 0.9" -Command "./.github/scripts/test-v09.ps1"

      - name: Probe deinstallieren (Abmeldung, Firewall, Token – nichts darf bleiben)
        shell: pwsh
        run: ./.github/scripts/run-logged.ps1 -Title "Probe-Deinstallation" -Command "./.github/scripts/test-uninstall.ps1 -Part Probe"

      - name: Logs bei Fehler
        if: failure()
        shell: pwsh
        run: |
          # GitHub zeigt höchstens 10 Annotationen je Schritt: die wichtigsten Logs zuerst
          $files = @('C:\WachtlData\logs\web.log', 'C:\WachtlData\logs\supervisor.log', 'C:\WachtlData\logs\serverprobe.log')
          $files += Get-ChildItem C:\ProgramData\Wachtl\logs -ErrorAction SilentlyContinue | ForEach-Object FullName
          $files += @('dist\probe-install.log', 'C:\WachtlData\logs\setup.log', 'dist\setup-install.log')
          foreach ($f in $files) {
            if (-not (Test-Path $f)) { continue }
            $text = (Get-Content $f -Tail 60) -join "`n"
            if ($text.Length -gt 3700) { $text = $text.Substring($text.Length - 3700) }
            Write-Host "==== $f"; Write-Host $text
            & ./.github/scripts/annotate.ps1 -Title ([IO.Path]::GetFileName($f)) -Text $text
          }

      - name: Server deinstallieren (Dienst, Firewall, Ports, Daten – nichts darf bleiben)
        shell: pwsh
        run: ./.github/scripts/run-logged.ps1 -Title "Server-Deinstallation" -Command "./.github/scripts/test-uninstall.ps1 -Part Server"

      - uses: actions/upload-artifact@v4
        with:
          name: wachtl-setups
          path: dist/WachtlSetup-${{ env.WACHTL_VERSION }}.exe

  setups-ins-repo:
    name: Setups ins Repository legen
    runs-on: ubuntu-latest
    needs: [server, windows-server]
    # nur auf main und nur einmal je Version (releases/<Version>/ noch nicht vorhanden)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # nur was der Job braucht – nicht die Setups aller früheren Versionen
          sparse-checkout: |
            /docs/
            /releases/${{ env.WACHTL_VERSION }}/
          sparse-checkout-cone-mode: false
      - name: Prüfen, ob diese Version schon im Repository liegt
        id: check
        run: |
          if [ -d "releases/$WACHTL_VERSION" ]; then
            echo "releases/$WACHTL_VERSION existiert bereits – nichts zu tun (für neue Setups Version erhöhen)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        if: steps.check.outputs.skip != 'true'
        with:
          name: wachtl-setups
          path: setups
      - name: Setups committen
        if: steps.check.outputs.skip != 'true'
        run: |
          dir="releases/$WACHTL_VERSION"
          mkdir -p "$dir"
          find setups -name '*.exe' -exec cp {} "$dir/" \;
          ls -la "$dir"
          for f in "$dir"/*.exe; do
            size=$(stat -c %s "$f")
            if [ "$size" -gt 99000000 ]; then echo "::error::$f ist größer als 99 MB (GitHub-Grenze 100 MB)"; exit 1; fi
          done
          (cd "$dir" && sha256sum *.exe > SHA256SUMS.txt)
          cp docs/RELEASE-NOTES.md "$dir/LIESMICH.md"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$dir"
          git commit -m "Setups $WACHTL_VERSION (geprüft in Lauf ${{ github.run_id }})"
          git pull --rebase origin main
          git push origin HEAD:main

  release:
    name: Release veröffentlichen
    runs-on: ubuntu-latest
    needs: [server, windows-server]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: docs
      - uses: actions/download-artifact@v4
        with:
          name: wachtl-setups
          path: release
      - name: Setups als GitHub-Release veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=$(find release -name '*.exe')
          sha256sum $files | sed 's#  .*/#  #' > SHA256SUMS.txt
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" $files SHA256SUMS.txt --clobber
          else
            gh release create "$GITHUB_REF_NAME" $files SHA256SUMS.txt --title "Wachtl ${GITHUB_REF_NAME#v}" \
              --notes-file docs/RELEASE-NOTES.md
          fi
