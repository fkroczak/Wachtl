name: Build und Tests

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

env:
  WACHTL_VERSION: "0.3.0"

jobs:
  server:
    name: Server-Tests (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  probe:
    name: Windows-Probe bauen (C#)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Testen und veröffentlichen
        shell: pwsh
        run: ./.github/scripts/run-logged.ps1 -Title "Probe-Build" -Command "./probe/build.ps1 -Version $env:WACHTL_VERSION -Output '${{ github.workspace }}/dist/probe'"
      - uses: actions/upload-artifact@v4
        with:
          name: wachtl-probe-win-x64
          path: dist/probe/

  windows-server:
    name: Windows-Server-Setup bauen und testen
    runs-on: windows-latest
    needs: [server, probe]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: wachtl-probe-win-x64
          path: dist/probe
      - name: Setup-Assistent bauen
        shell: pwsh
        run: ./.github/scripts/run-logged.ps1 -Title "Server-Setup-Build" -Command "./windows/build-server.ps1 -Version $env:WACHTL_VERSION -ProbeDir dist/probe -Output dist"

      - name: Unbeaufsichtigt installieren
        shell: pwsh
        run: |
          $setup = "dist/WachtlServerSetup-$env:WACHTL_VERSION.exe"
          $p = Start-Process $setup -Wait -PassThru -ArgumentList @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/LOG=dist\setup-install.log',
            '/Hostnames=localhost,127.0.0.1', '/HttpsPort=8443', '/HttpPort=8080',
            '/AdminPassword=ci-test-passwort-123', '/DataDir=C:\WachtlData')
          Write-Host "Setup beendet mit $($p.ExitCode)"
          Get-Content C:\WachtlData\logs\setup.log -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { throw 'Setup fehlgeschlagen' }

      - name: Server prüfen
        shell: pwsh
        run: ./.github/scripts/run-logged.ps1 -Title "Server-Prüfung" -Command "./.github/scripts/test-server.ps1"

      - name: Probe-Setup unbeaufsichtigt installieren und anmelden lassen
        shell: pwsh
        run: ./.github/scripts/run-logged.ps1 -Title "Probe-Prüfung" -Command "./.github/scripts/test-probe.ps1"

      - name: Pfad, Hop-Pings und iperf3 Ende-zu-Ende prüfen
        shell: pwsh
        run: ./.github/scripts/run-logged.ps1 -Title "E2E 0.3" -Command "./.github/scripts/test-v03.ps1"

      - name: Probe deinstallieren
        shell: pwsh
        run: |
          $p = Start-Process "${env:ProgramFiles}\Wachtl\unins000.exe" -Wait -PassThru -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES'
          if ($p.ExitCode -ne 0) { throw "Probe-Deinstallation fehlgeschlagen ($($p.ExitCode))" }
          if (Get-Service Wachtl -ErrorAction SilentlyContinue) { throw 'Probe-Dienst noch vorhanden' }

      - name: Logs bei Fehler
        if: failure()
        shell: pwsh
        run: |
          # GitHub zeigt höchstens 10 Annotationen je Schritt: die wichtigsten Logs zuerst
          $files = @('C:\WachtlData\logs\web.log', 'C:\WachtlData\logs\supervisor.log')
          $files += Get-ChildItem C:\ProgramData\Wachtl\logs -ErrorAction SilentlyContinue | ForEach-Object FullName
          $files += @('dist\probe-install.log', 'C:\WachtlData\logs\setup.log', 'dist\setup-install.log')
          foreach ($f in $files) {
            if (-not (Test-Path $f)) { continue }
            $text = (Get-Content $f -Tail 60) -join "`n"
            if ($text.Length -gt 3700) { $text = $text.Substring($text.Length - 3700) }
            Write-Host "==== $f"; Write-Host $text
            & ./.github/scripts/annotate.ps1 -Title ([IO.Path]::GetFileName($f)) -Text $text
          }

      - name: Deinstallieren
        shell: pwsh
        run: |
          $p = Start-Process "${env:ProgramFiles}\Wachtl Server\unins000.exe" -Wait -PassThru -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES'
          if ($p.ExitCode -ne 0) { throw "Deinstallation fehlgeschlagen ($($p.ExitCode))" }
          if (Get-Service WachtlServer -ErrorAction SilentlyContinue) { throw 'Dienst noch vorhanden' }

      - uses: actions/upload-artifact@v4
        with:
          name: wachtl-setups
          path: |
            dist/WachtlServerSetup-*.exe
            dist/probe/WachtlProbeSetup-*.exe

  release:
    name: Release veröffentlichen
    runs-on: ubuntu-latest
    needs: [windows-server]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: wachtl-setups
          path: release
      - name: Setups als GitHub-Release veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=$(find release -name '*.exe')
          sha256sum $files | sed 's#  .*/#  #' > SHA256SUMS.txt
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" $files SHA256SUMS.txt --clobber
          else
            gh release create "$GITHUB_REF_NAME" $files SHA256SUMS.txt --title "Wachtl ${GITHUB_REF_NAME#v}" \
              --notes-file docs/RELEASE-NOTES.md
          fi
