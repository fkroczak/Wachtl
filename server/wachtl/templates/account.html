{% extends "base.html" %}
{% block title %}Konto{% endblock %}
{% block content %}
<h1>Konto {{ user.username }}</h1>
<form method="post" class="stack narrow">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label>Altes Passwort <input name="old_password" type="password" required autocomplete="current-password"></label>
  <label>Neues Passwort <input name="new_password" type="password" required autocomplete="new-password"></label>
  <button class="primary">Passwort ändern</button>
</form>
{% endblock %}
